name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '*-format'
      - '.gitignore'
  workflow_dispatch:

jobs:
  ci:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [focal, jammy, noble]
    container:
      image: ubuntu:${{ matrix.distro }}
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang-tidy cmake git ninja-build python3-yaml \
            libboost-filesystem-dev libceres-dev libeigen3-dev libgtest-dev \
            libopencv-dev libyaml-cpp-dev qtbase5-dev
      - name: Build and test
        run: bash .github/scripts/build-ubuntu.sh "$RUNNER_TEMP/calibration-workbench"
