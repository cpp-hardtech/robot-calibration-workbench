name: CMake-Format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cmake_lang:
    name: CMake Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run CMake Lang Format Check
        run: |
          sudo pip3 install cmakelang==0.6.13
          ./.run-cmake-format
          git diff --exit-code
