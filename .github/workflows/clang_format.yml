name: Clang-Format

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  clang_format:
    name: Clang Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run Clang Format Check
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          ./.run-clang-format
          git diff --exit-code
