name: Build Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Doxygen
        working-directory: docs
        run: |
          apt update -y -qq
          apt install -y -qq doxygen graphviz texlive-latex-extra ghostscript
          doxygen Doxyfile
          touch build/html/.nojekyll

      - name: Check Pages configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              core.setOutput('deploy', data.build_type === 'workflow');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('GitHub Pages has no site for this repository.');
              core.setOutput('deploy', false);
            }

      - name: Upload artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
